# =============================================================================
# CEREBRO-X v22.1  |  Prometheus Configuration
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# ── Alerting rules (when Alertmanager is added) ──────────────────────────────
# rule_files:
#   - /etc/prometheus/rules/*.yml

scrape_configs:

  # ── CEREBRO API Metrics ────────────────────────────────────────────────────
  - job_name: 'cerebro-api'
    scrape_interval: 10s
    dns_sd_configs:
      - names:
          - 'cerebro-api'
        type: A
        port: 8001
    # Fallback static config
    static_configs:
      - targets:
          - 'cerebro-api:8001'
        labels:
          service: 'cerebro-api'

  # ── Redis Metrics (via redis_exporter — add if needed) ─────────────────────
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']

  # ── PostgreSQL Metrics (via postgres_exporter — add if needed) ─────────────
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']

  # ── Nginx Metrics (via nginx-prometheus-exporter — add if needed) ──────────
  # - job_name: 'nginx'
  #   static_configs:
  #     - targets: ['nginx-exporter:9113']

  # ── Prometheus self-monitoring ─────────────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
