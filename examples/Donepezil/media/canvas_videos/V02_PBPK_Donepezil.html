<html lang="en">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root {
  --void-base:#060610; --void-elevated:#0a0a1a; --void-panel:#0f2040;
  --gold:#C9A84C; --gold-light:#D4B563; --gold-dark:#B89A3F;
  --neuro-positive:#0D6E6E; --alert-red:#C62828; --molecule-orange:#F57C00;
  --text-primary:#E0E0E0; --text-secondary:#9CA3AF; --text-muted:#6B7280;
  --hairline:#1F2937;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--void-base);
       font-family: 'Inter','Segoe UI',Helvetica,Arial,sans-serif;
       color: var(--text-primary); font-weight: 300;
       line-height: 1.65; letter-spacing: 0.01em; }
.container { max-width: 900px; margin: 0 auto; padding: 24px; }
h2 { color: var(--gold); font-size: 1.4em; font-weight: 700;
     margin-bottom: 6px; letter-spacing: -0.3px; }
.subtitle { color: var(--text-secondary); font-size: .82em;
            margin-bottom: 16px; font-weight: 400; }
canvas { display: block; border-radius: 10px;
         border: 1px solid var(--hairline); background: var(--void-elevated); }
.ctrl { margin-top: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
button { background: var(--void-panel); color: var(--text-primary);
         border: 1px solid var(--hairline); padding: 8px 18px;
         border-radius: 8px; cursor: pointer; font-family: inherit;
         font-size: .85em; font-weight: 500; transition: all .2s ease; }
button:hover { background: var(--void-elevated); border-color: var(--gold);
               color: var(--gold); transform: translateY(-1px); }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
           gap: 10px; margin-top: 16px; }
.metric { background: var(--void-panel); border: 1px solid var(--hairline);
          border-radius: 10px; padding: 14px; text-align: center; }
.metric-val { color: var(--gold); font-size: 1.5em; font-weight: 800;
              letter-spacing: -0.4px; line-height: 1.1; }
.metric-lbl { color: var(--text-muted); font-size: .68em; margin-top: 5px;
              text-transform: uppercase; letter-spacing: 1.5px; font-weight: 500; }
.progress { width: 100%; height: 6px; background: var(--hairline);
            border-radius: 3px; margin-top: 10px; overflow: hidden; }
.progress-bar { height: 6px; background: linear-gradient(90deg,var(--gold-dark),var(--gold),var(--gold-light));
                border-radius: 3px; transition: width .05s; }
</style>

</head>
<body>
<div class="container">
  <h2>CEREBRO-X | V02 — PBPK Digital Twin | Donepezil</h2>
  <p class="subtitle">6-compartment ODE simulation | Kp,brain=1.06181 | Cmax_brain=0.22130 µg/mL</p>
  <canvas id="c02" width="860" height="340"></canvas>
  <div class="progress"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
  <div class="ctrl">
    <button onclick="anim.toggle()" id="playBtn">▶ Play</button>
    <button onclick="anim.reset()">↺ Reset</button>
    <button onclick="anim.step()">⏭ Step +1%</button>
  </div>
  <div class="metrics">
  <div class="metric"><div class="metric-val">0.22130</div><div class="metric-lbl">Cmax brain (µg/mL)</div></div>
  <div class="metric"><div class="metric-val">2.4h</div><div class="metric-lbl">t_max brain</div></div>
  <div class="metric"><div class="metric-val">1.06181</div><div class="metric-lbl">Kp,brain</div></div>
  <div class="metric"><div class="metric-val">7.2967</div><div class="metric-lbl">AUC brain (µg·h/mL)</div></div>
</div>
</div>

const series={
  Plasma:    {data:[0.25, 0.2319, 0.22049, 0.21279, 0.20604, 0.20123, 0.19507, 0.18913, 0.18342, 0.17791, 0.17391, 0.16875, 0.16377, 0.15896, 0.15546, 0.15095, 0.14659, 0.14238, 0.13831, 0.13535, 0.13152, 0.12782, 0.12424, 0.12079, 0.11827, 0.115, 0.11184, 0.10879, 0.10656, 0.10367, 0.10087, 0.09816, 0.09554, 0.09363, 0.09114, 0.08873, 0.0864, 0.08414, 0.08248, 0.08034, 0.07825, 0.07623, 0.07475, 0.07284, 0.07097, 0.06916, 0.06741, 0.06612, 0.06445, 0.06283, 0.06125, 0.05972, 0.0586, 0.05714, 0.05572, 0.05434, 0.05333, 0.05202, 0.05074, 0.0495, 0.04828, 0.0474, 0.04624, 0.04512, 0.04403, 0.04296, 0.04218, 0.04116, 0.04017, 0.03921, 0.0385, 0.03758, 0.03668, 0.0358, 0.03495, 0.03433, 0.03351, 0.03272, 0.03194, 0.03119], color:'#F57C00'},
  'Brain ISF':{data:[0.0, 0.16429, 0.21604, 0.22109, 0.21693, 0.2126, 0.2066, 0.20069, 0.19497, 0.18943, 0.1854, 0.18019, 0.17515, 0.17027, 0.16672, 0.16212, 0.15767, 0.15336, 0.14919, 0.14615, 0.14221, 0.13839, 0.13469, 0.13111, 0.12849, 0.1251, 0.12181, 0.11862, 0.11629, 0.11326, 0.11032, 0.10748, 0.10471, 0.10269, 0.10006, 0.09751, 0.09504, 0.09263, 0.09087, 0.08859, 0.08636, 0.0842, 0.08262, 0.08056, 0.07856, 0.07662, 0.07473, 0.07334, 0.07154, 0.06979, 0.06808, 0.06642, 0.0652, 0.06362, 0.06207, 0.06057, 0.05947, 0.05804, 0.05664, 0.05528, 0.05395, 0.05298, 0.05172, 0.05048, 0.04928, 0.04811, 0.04725, 0.04613, 0.04504, 0.04397, 0.04319, 0.04217, 0.04118, 0.04021, 0.03927, 0.03857, 0.03767, 0.03679, 0.03593, 0.03509], color:'#C9A84C'},
  CSF:       {data:[0.0, 0.0369, 0.1287, 0.21957, 0.29855, 0.34951, 0.40737, 0.45503, 0.49385, 0.52504, 0.54405, 0.56433, 0.57955, 0.59045, 0.59615, 0.60092, 0.60288, 0.60247, 0.60005, 0.59711, 0.59191, 0.58548, 0.57803, 0.56976, 0.5631, 0.55374, 0.54393, 0.53378, 0.52601, 0.51548, 0.50483, 0.49411, 0.48338, 0.47535, 0.4647, 0.45413, 0.44367, 0.43334, 0.42569, 0.41564, 0.40575, 0.39605, 0.38889, 0.37952, 0.37035, 0.36137, 0.35259, 0.34614, 0.33771, 0.32948, 0.32144, 0.3136, 0.30785, 0.30034, 0.29302, 0.28589, 0.28065, 0.27383, 0.26717, 0.26069, 0.25437, 0.24974, 0.2437, 0.23781, 0.23208, 0.22649, 0.22239, 0.21704, 0.21184, 0.20676, 0.20304, 0.19819, 0.19346, 0.18885, 0.18436, 0.18106, 0.17676, 0.17257, 0.16849, 0.16451],color:'#7C4DFF'},
  'Brain Cell':{data:[0.0, 0.00149, 0.00539, 0.00955, 0.0135, 0.01627, 0.01971, 0.02287, 0.02576, 0.02841, 0.03024, 0.03248, 0.03452, 0.03636, 0.03762, 0.03915, 0.04051, 0.04173, 0.0428, 0.04352, 0.04436, 0.04509, 0.04571, 0.04623, 0.04655, 0.04691, 0.04718, 0.04737, 0.04747, 0.04754, 0.04754, 0.04749, 0.04739, 0.04728, 0.04709, 0.04685, 0.04658, 0.04627, 0.04602, 0.04566, 0.04526, 0.04485, 0.04452, 0.04406, 0.04359, 0.04309, 0.04258, 0.04219, 0.04166, 0.04112, 0.04057, 0.04001, 0.03959, 0.03902, 0.03845, 0.03787, 0.03743, 0.03685, 0.03627, 0.03569, 0.0351, 0.03467, 0.03409, 0.03351, 0.03293, 0.03236, 0.03194, 0.03137, 0.03081, 0.03025, 0.02984, 0.02929, 0.02875, 0.02822, 0.02769, 0.02729, 0.02678, 0.02626, 0.02576, 0.02526],color:'#0D6E6E'},
  Peripheral:{data:[0.0, 1e-05, 3e-05, 5e-05, 6e-05, 7e-05, 9e-05, 0.0001, 0.00012, 0.00013, 0.00014, 0.00015, 0.00016, 0.00017, 0.00018, 0.00019, 0.00021, 0.00022, 0.00023, 0.00023, 0.00024, 0.00025, 0.00026, 0.00027, 0.00028, 0.00029, 0.0003, 0.0003, 0.00031, 0.00032, 0.00032, 0.00033, 0.00034, 0.00034, 0.00035, 0.00036, 0.00036, 0.00037, 0.00038, 0.00038, 0.00039, 0.00039, 0.0004, 0.0004, 0.00041, 0.00041, 0.00042, 0.00042, 0.00043, 0.00043, 0.00044, 0.00044, 0.00044, 0.00045, 0.00045, 0.00046, 0.00046, 0.00046, 0.00047, 0.00047, 0.00047, 0.00048, 0.00048, 0.00048, 0.00049, 0.00049, 0.00049, 0.00049, 0.0005, 0.0005, 0.0005, 0.0005, 0.00051, 0.00051, 0.00051, 0.00051, 0.00052, 0.00052, 0.00052, 0.00052],color:'#C62828'},
};
const maxC=Math.max(...Object.values(series).flatMap(s=>s.data))*1.15||0.01;
const W2=C2.width,H2=C2.height,PAD={t:20,r:120,b:40,l:70};
const plotW=W2-PAD.l-PAD.r,plotH=H2-PAD.t-PAD.b;
const scX=i=>PAD.l+i/tArr.length*plotW;
const scY=v=>PAD.t+plotH-(v/maxC)*plotH;

const anim2=(function(){
  let t=0,playing=false,raf=null;
  function draw(progress){
    X2.fillStyle='#0a0a1a';X2.fillRect(0,0,W2,H2);
    // Grid
    X2.strokeStyle='#1F2937';X2.lineWidth=0.5;
    for(let i=0;i<=5;i++){
      const y=PAD.t+i*plotH/5;
      X2.beginPath();X2.moveTo(PAD.l,y);X2.lineTo(W2-PAD.r,y);X2.stroke();
      const v=(maxC*(1-i/5)).toFixed(5);
      X2.fillStyle='#888';X2.font='9px monospace';X2.textAlign='right';
      X2.fillText(v,PAD.l-4,y+3);
    }
    for(let i=0;i<=8;i++){
      const x=PAD.l+i*plotW/8;
      X2.beginPath();X2.moveTo(x,PAD.t);X2.lineTo(x,H2-PAD.b);X2.stroke();
      const tv=Math.round(tArr[Math.floor(i*(tArr.length-1)/8)]);
      X2.fillStyle='#888';X2.textAlign='center';
      X2.fillText(tv+'h',x,H2-PAD.b+14);
    }
    // Axes labels
    X2.fillStyle='#C9A84C';X2.font='10px monospace';X2.textAlign='center';
    X2.fillText('Time (h)',W2/2,H2-4);
    X2.save();X2.translate(14,H2/2);X2.rotate(-Math.PI/2);
    X2.fillText('Concentration (µg/mL)',0,0);X2.restore();

    // Series
    const nPts=Math.floor(progress*tArr.length);
    let li=0;
    Object.entries(series).forEach(([name,{data,color}])=>{
      if(nPts<2)return;
      X2.beginPath();
      X2.moveTo(scX(0),scY(data[0]));
      for(let i=1;i<nPts;i++) X2.lineTo(scX(i),scY(data[i]));
      X2.strokeStyle=color;X2.lineWidth=2;X2.stroke();
      // Legend
      X2.fillStyle=color;X2.fillRect(W2-PAD.r+8,PAD.t+li*18,12,3);
      X2.fillStyle='#E0E0E0';X2.font='9px monospace';X2.textAlign='left';
      X2.fillText(name,W2-PAD.r+24,PAD.t+li*18+4);
      li++;
    });
    document.getElementById('progressBar').style.width=(progress*100)+'%';
  }
  function loop(){
    if(!playing)return;
    t=Math.min(1,t+0.006);draw(t);
    if(t>=1){playing=false;document.getElementById('playBtn').textContent='↺ Replay';return;}
    raf=requestAnimationFrame(loop);
  }
  return{
    toggle(){if(t>=1)t=0;playing=!playing;
      document.getElementById('playBtn').textContent=playing?'⏸ Pause':'▶ Play';if(playing)loop();},
    reset(){t=0;playing=false;draw(0);document.getElementById('playBtn').textContent='▶ Play';},
    step(){t=Math.min(1,t+0.02);draw(t);},
  };
})();
anim2.reset();

</script>
</body>
