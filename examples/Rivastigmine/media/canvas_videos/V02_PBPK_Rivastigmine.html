<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CEREBRO-X | V02 — PBPK Digital Twin | Rivastigmine</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800;900&display=swap">
<style>
:root {
  --void-base:#060610; --void-elevated:#0a0a1a; --void-panel:#0f2040;
  --gold:#C9A84C; --gold-light:#D4B563; --gold-dark:#B89A3F;
  --neuro-positive:#0D6E6E; --alert-red:#C62828; --molecule-orange:#F57C00;
  --text-primary:#E0E0E0; --text-secondary:#9CA3AF; --text-muted:#6B7280;
  --hairline:#1F2937;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--void-base);
       font-family: 'Inter','Segoe UI',Helvetica,Arial,sans-serif;
       color: var(--text-primary); font-weight: 300;
       line-height: 1.65; letter-spacing: 0.01em; }
.container { max-width: 900px; margin: 0 auto; padding: 24px; }
h2 { color: var(--gold); font-size: 1.4em; font-weight: 700;
     margin-bottom: 6px; letter-spacing: -0.3px; }
.subtitle { color: var(--text-secondary); font-size: .82em;
            margin-bottom: 16px; font-weight: 400; }
canvas { display: block; border-radius: 10px;
         border: 1px solid var(--hairline); background: var(--void-elevated); }
.ctrl { margin-top: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
button { background: var(--void-panel); color: var(--text-primary);
         border: 1px solid var(--hairline); padding: 8px 18px;
         border-radius: 8px; cursor: pointer; font-family: inherit;
         font-size: .85em; font-weight: 500; transition: all .2s ease; }
button:hover { background: var(--void-elevated); border-color: var(--gold);
               color: var(--gold); transform: translateY(-1px); }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
           gap: 10px; margin-top: 16px; }
.metric { background: var(--void-panel); border: 1px solid var(--hairline);
          border-radius: 10px; padding: 14px; text-align: center; }
.metric-val { color: var(--gold); font-size: 1.5em; font-weight: 800;
              letter-spacing: -0.4px; line-height: 1.1; }
.metric-lbl { color: var(--text-muted); font-size: .68em; margin-top: 5px;
              text-transform: uppercase; letter-spacing: 1.5px; font-weight: 500; }
.progress { width: 100%; height: 6px; background: var(--hairline);
            border-radius: 3px; margin-top: 10px; overflow: hidden; }
.progress-bar { height: 6px; background: linear-gradient(90deg,var(--gold-dark),var(--gold),var(--gold-light));
                border-radius: 3px; transition: width .05s; }
</style>

</head>
<body>
<div class="container">
  <h2>CEREBRO-X | V02 — PBPK Digital Twin | Rivastigmine</h2>
  <p class="subtitle">6-compartment ODE simulation | Kp,brain=1.03180 | Cmax_brain=0.21400 µg/mL</p>
  <canvas id="c02" width="860" height="340"></canvas>
  <div class="progress"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
  <div class="ctrl">
    <button onclick="anim.toggle()" id="playBtn">▶ Play</button>
    <button onclick="anim.reset()">↺ Reset</button>
    <button onclick="anim.step()">⏭ Step +1%</button>
  </div>
  <div class="metrics">
  <div class="metric"><div class="metric-val">0.21400</div><div class="metric-lbl">Cmax brain (µg/mL)</div></div>
  <div class="metric"><div class="metric-val">2.6h</div><div class="metric-lbl">t_max brain</div></div>
  <div class="metric"><div class="metric-val">1.03180</div><div class="metric-lbl">Kp,brain</div></div>
  <div class="metric"><div class="metric-val">7.1406</div><div class="metric-lbl">AUC brain (µg·h/mL)</div></div>
</div>
</div>
<script>

const X2 = C2.getContext('2d');

const series={
  Plasma:    {data:[0.25, 0.23327, 0.2218, 0.21395, 0.20714, 0.20233, 0.19616, 0.19024, 0.18452, 0.17902, 0.17502, 0.16985, 0.16486, 0.16005, 0.15654, 0.15202, 0.14765, 0.14342, 0.13934, 0.13637, 0.13253, 0.12881, 0.12521, 0.12174, 0.1192, 0.11592, 0.11274, 0.10967, 0.10743, 0.10452, 0.1017, 0.09897, 0.09633, 0.0944, 0.0919, 0.08947, 0.08712, 0.08483, 0.08317, 0.081, 0.0789, 0.07686, 0.07537, 0.07343, 0.07155, 0.06973, 0.06795, 0.06666, 0.06497, 0.06333, 0.06174, 0.06019, 0.05906, 0.05759, 0.05615, 0.05476, 0.05374, 0.05241, 0.05112, 0.04986, 0.04864, 0.04775, 0.04658, 0.04544, 0.04434, 0.04326, 0.04247, 0.04145, 0.04045, 0.03947, 0.03876, 0.03783, 0.03692, 0.03603, 0.03517, 0.03454, 0.03372, 0.03292, 0.03213, 0.03137], color:'#F57C00'},
  'Brain ISF':{data:[0.0, 0.15093, 0.20594, 0.21402, 0.21118, 0.20732, 0.20168, 0.19603, 0.19053, 0.18519, 0.1813, 0.17627, 0.17139, 0.16668, 0.16324, 0.15879, 0.15447, 0.1503, 0.14625, 0.1433, 0.13947, 0.13576, 0.13216, 0.12867, 0.12612, 0.12282, 0.11961, 0.1165, 0.11423, 0.11127, 0.10841, 0.10562, 0.10292, 0.10094, 0.09838, 0.09588, 0.09346, 0.0911, 0.08938, 0.08714, 0.08496, 0.08284, 0.08129, 0.07927, 0.07731, 0.0754, 0.07354, 0.07218, 0.07041, 0.06869, 0.06701, 0.06538, 0.06418, 0.06262, 0.0611, 0.05963, 0.05854, 0.05713, 0.05576, 0.05442, 0.05311, 0.05216, 0.05091, 0.0497, 0.04851, 0.04736, 0.04651, 0.04541, 0.04433, 0.04328, 0.04251, 0.04151, 0.04053, 0.03958, 0.03864, 0.03796, 0.03707, 0.0362, 0.03535, 0.03453], color:'#C9A84C'},
  CSF:       {data:[0.0, 0.03334, 0.11973, 0.20765, 0.28508, 0.3353, 0.39248, 0.4397, 0.47824, 0.50928, 0.52827, 0.54858, 0.56393, 0.57501, 0.58089, 0.58592, 0.58819, 0.58811, 0.58604, 0.58337, 0.57855, 0.5725, 0.56543, 0.55754, 0.55116, 0.54218, 0.53274, 0.52296, 0.51545, 0.50526, 0.49495, 0.48456, 0.47415, 0.46636, 0.456, 0.44572, 0.43554, 0.42548, 0.41803, 0.40822, 0.39858, 0.38911, 0.38212, 0.37296, 0.364, 0.35522, 0.34663, 0.34031, 0.33206, 0.324, 0.31613, 0.30845, 0.30281, 0.29545, 0.28827, 0.28126, 0.27613, 0.26943, 0.26289, 0.25653, 0.25032, 0.24577, 0.23983, 0.23404, 0.2284, 0.22291, 0.21888, 0.21362, 0.2085, 0.2035, 0.19984, 0.19507, 0.19041, 0.18587, 0.18145, 0.1782, 0.17397, 0.16985, 0.16582, 0.1619],color:'#7C4DFF'},
  'Brain Cell':{data:[0.0, 0.00135, 0.00501, 0.00902, 0.01287, 0.01558, 0.01895, 0.02205, 0.02489, 0.02749, 0.02929, 0.03149, 0.0335, 0.03532, 0.03656, 0.03807, 0.03942, 0.04062, 0.04169, 0.0424, 0.04324, 0.04397, 0.04459, 0.04511, 0.04544, 0.0458, 0.04607, 0.04628, 0.04638, 0.04646, 0.04648, 0.04644, 0.04635, 0.04625, 0.04607, 0.04585, 0.0456, 0.0453, 0.04506, 0.04471, 0.04434, 0.04394, 0.04362, 0.04318, 0.04272, 0.04224, 0.04175, 0.04137, 0.04086, 0.04033, 0.03979, 0.03925, 0.03884, 0.03828, 0.03772, 0.03716, 0.03674, 0.03617, 0.0356, 0.03503, 0.03446, 0.03404, 0.03347, 0.03291, 0.03234, 0.03179, 0.03137, 0.03081, 0.03027, 0.02972, 0.02932, 0.02878, 0.02825, 0.02773, 0.02721, 0.02682, 0.02631, 0.02581, 0.02531, 0.02482],color:'#0D6E6E'},
  Peripheral:{data:[0.0, 2e-05, 4e-05, 6e-05, 8e-05, 0.0001, 0.00012, 0.00014, 0.00016, 0.00018, 0.00019, 0.00021, 0.00022, 0.00024, 0.00025, 0.00027, 0.00028, 0.0003, 0.00031, 0.00032, 0.00033, 0.00035, 0.00036, 0.00037, 0.00038, 0.00039, 0.0004, 0.00042, 0.00042, 0.00043, 0.00044, 0.00045, 0.00046, 0.00047, 0.00048, 0.00049, 0.0005, 0.00051, 0.00051, 0.00052, 0.00053, 0.00054, 0.00054, 0.00055, 0.00056, 0.00056, 0.00057, 0.00058, 0.00058, 0.00059, 0.0006, 0.0006, 0.00061, 0.00061, 0.00062, 0.00062, 0.00063, 0.00063, 0.00064, 0.00064, 0.00065, 0.00065, 0.00066, 0.00066, 0.00066, 0.00067, 0.00067, 0.00068, 0.00068, 0.00068, 0.00069, 0.00069, 0.00069, 0.0007, 0.0007, 0.0007, 0.00071, 0.00071, 0.00071, 0.00072],color:'#C62828'},
};
const maxC=Math.max(...Object.values(series).flatMap(s=>s.data))*1.15||0.01;
const W2=C2.width,H2=C2.height,PAD={t:20,r:120,b:40,l:70};
const plotW=W2-PAD.l-PAD.r,plotH=H2-PAD.t-PAD.b;
const scX=i=>PAD.l+i/tArr.length*plotW;
const scY=v=>PAD.t+plotH-(v/maxC)*plotH;

const anim2=(function(){
  let t=0,playing=false,raf=null;
  function draw(progress){
    X2.fillStyle='#0a0a1a';X2.fillRect(0,0,W2,H2);
    // Grid
    X2.strokeStyle='#1F2937';X2.lineWidth=0.5;
    for(let i=0;i<=5;i++){
      const y=PAD.t+i*plotH/5;
      X2.beginPath();X2.moveTo(PAD.l,y);X2.lineTo(W2-PAD.r,y);X2.stroke();
      const v=(maxC*(1-i/5)).toFixed(5);
      X2.fillStyle='#888';X2.font='9px monospace';X2.textAlign='right';
      X2.fillText(v,PAD.l-4,y+3);
    }
    for(let i=0;i<=8;i++){
      const x=PAD.l+i*plotW/8;
      X2.beginPath();X2.moveTo(x,PAD.t);X2.lineTo(x,H2-PAD.b);X2.stroke();
      const tv=Math.round(tArr[Math.floor(i*(tArr.length-1)/8)]);
      X2.fillStyle='#888';X2.textAlign='center';
      X2.fillText(tv+'h',x,H2-PAD.b+14);
    }
    // Axes labels
    X2.fillStyle='#C9A84C';X2.font='10px monospace';X2.textAlign='center';
    X2.fillText('Time (h)',W2/2,H2-4);
    X2.save();X2.translate(14,H2/2);X2.rotate(-Math.PI/2);
    X2.fillText('Concentration (µg/mL)',0,0);X2.restore();

    // Series
    const nPts=Math.floor(progress*tArr.length);
    let li=0;
    Object.entries(series).forEach(([name,{data,color}])=>{
      if(nPts<2)return;
      X2.beginPath();
      X2.moveTo(scX(0),scY(data[0]));
      for(let i=1;i<nPts;i++) X2.lineTo(scX(i),scY(data[i]));
      X2.strokeStyle=color;X2.lineWidth=2;X2.stroke();
      // Legend
      X2.fillStyle=color;X2.fillRect(W2-PAD.r+8,PAD.t+li*18,12,3);
      X2.fillStyle='#E0E0E0';X2.font='9px monospace';X2.textAlign='left';
      X2.fillText(name,W2-PAD.r+24,PAD.t+li*18+4);
      li++;
    });
    document.getElementById('progressBar').style.width=(progress*100)+'%';
  }
  function loop(){
    if(!playing)return;
    t=Math.min(1,t+0.006);draw(t);
    if(t>=1){playing=false;document.getElementById('playBtn').textContent='↺ Replay';return;}
    raf=requestAnimationFrame(loop);
  }
  return{
    toggle(){if(t>=1)t=0;playing=!playing;
      document.getElementById('playBtn').textContent=playing?'⏸ Pause':'▶ Play';if(playing)loop();},
    reset(){t=0;playing=false;draw(0);document.getElementById('playBtn').textContent='▶ Play';},
    step(){t=Math.min(1,t+0.02);draw(t);},
  };
})();
anim2.reset();

</script>
</body>
</html>
