<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CEREBRO-X | V02 — PBPK Digital Twin | Temozolomide</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800;900&display=swap">
<style>
:root {
  --void-base:#060610; --void-elevated:#0a0a1a; --void-panel:#0f2040;
  --gold:#C9A84C; --gold-light:#D4B563; --gold-dark:#B89A3F;
  --neuro-positive:#0D6E6E; --alert-red:#C62828; --molecule-orange:#F57C00;
  --text-primary:#E0E0E0; --text-secondary:#9CA3AF; --text-muted:#6B7280;
  --hairline:#1F2937;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--void-base);
       font-family: 'Inter','Segoe UI',Helvetica,Arial,sans-serif;
       color: var(--text-primary); font-weight: 300;
       line-height: 1.65; letter-spacing: 0.01em; }
.container { max-width: 900px; margin: 0 auto; padding: 24px; }
h2 { color: var(--gold); font-size: 1.4em; font-weight: 700;
     margin-bottom: 6px; letter-spacing: -0.3px; }
.subtitle { color: var(--text-secondary); font-size: .82em;
            margin-bottom: 16px; font-weight: 400; }
canvas { display: block; border-radius: 10px;
         border: 1px solid var(--hairline); background: var(--void-elevated); }
.ctrl { margin-top: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
button { background: var(--void-panel); color: var(--text-primary);
         border: 1px solid var(--hairline); padding: 8px 18px;
         border-radius: 8px; cursor: pointer; font-family: inherit;
         font-size: .85em; font-weight: 500; transition: all .2s ease; }
button:hover { background: var(--void-elevated); border-color: var(--gold);
               color: var(--gold); transform: translateY(-1px); }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
           gap: 10px; margin-top: 16px; }
.metric { background: var(--void-panel); border: 1px solid var(--hairline);
          border-radius: 10px; padding: 14px; text-align: center; }
.metric-val { color: var(--gold); font-size: 1.5em; font-weight: 800;
              letter-spacing: -0.4px; line-height: 1.1; }
.metric-lbl { color: var(--text-muted); font-size: .68em; margin-top: 5px;
              text-transform: uppercase; letter-spacing: 1.5px; font-weight: 500; }
.progress { width: 100%; height: 6px; background: var(--hairline);
            border-radius: 3px; margin-top: 10px; overflow: hidden; }
.progress-bar { height: 6px; background: linear-gradient(90deg,var(--gold-dark),var(--gold),var(--gold-light));
                border-radius: 3px; transition: width .05s; }
</style>

</head>
<body>
<div class="container">
  <h2>CEREBRO-X | V02 — PBPK Digital Twin | Temozolomide</h2>
  <p class="subtitle">6-compartment ODE simulation | Kp,brain=0.33725 | Cmax_brain=0.06130 µg/mL</p>
  <canvas id="c02" width="860" height="340"></canvas>
  <div class="progress"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
  <div class="ctrl">
    <button onclick="anim.toggle()" id="playBtn">▶ Play</button>
    <button onclick="anim.reset()">↺ Reset</button>
    <button onclick="anim.step()">⏭ Step +1%</button>
  </div>
  <div class="metrics">
  <div class="metric"><div class="metric-val">0.06130</div><div class="metric-lbl">Cmax brain (µg/mL)</div></div>
  <div class="metric"><div class="metric-val">6.5h</div><div class="metric-lbl">t_max brain</div></div>
  <div class="metric"><div class="metric-val">0.33725</div><div class="metric-lbl">Kp,brain</div></div>
  <div class="metric"><div class="metric-val">2.2462</div><div class="metric-lbl">AUC brain (µg·h/mL)</div></div>
</div>
</div>
<script>

const series={
  Plasma:    {data:[0.25, 0.24332, 0.23488, 0.22687, 0.21923, 0.21372, 0.20662, 0.19978, 0.1932, 0.18685, 0.18223, 0.17626, 0.1705, 0.16493, 0.16088, 0.15563, 0.15057, 0.14567, 0.14094, 0.1375, 0.13305, 0.12874, 0.12458, 0.12055, 0.11763, 0.11384, 0.11017, 0.10663, 0.10405, 0.10072, 0.09749, 0.09437, 0.09136, 0.08916, 0.08632, 0.08357, 0.08092, 0.07835, 0.07648, 0.07406, 0.07172, 0.06945, 0.06781, 0.06567, 0.06361, 0.06161, 0.05968, 0.05828, 0.05646, 0.0547, 0.053, 0.05135, 0.05015, 0.0486, 0.0471, 0.04565, 0.04459, 0.04322, 0.04189, 0.04061, 0.03937, 0.03847, 0.0373, 0.03617, 0.03507, 0.03401, 0.03324, 0.03224, 0.03128, 0.03034, 0.02966, 0.02878, 0.02792, 0.0271, 0.0263, 0.02572, 0.02496, 0.02423, 0.02352, 0.02284], color:'#F57C00'},
  'Brain ISF':{data:[0.0, 0.01967, 0.0383, 0.04946, 0.05591, 0.05871, 0.06068, 0.06133, 0.06115, 0.06046, 0.05973, 0.05858, 0.05731, 0.05598, 0.05496, 0.05359, 0.05223, 0.05089, 0.04956, 0.04859, 0.04731, 0.04607, 0.04485, 0.04366, 0.04278, 0.04164, 0.04053, 0.03945, 0.03865, 0.03762, 0.03661, 0.03563, 0.03467, 0.03396, 0.03305, 0.03216, 0.03129, 0.03044, 0.02982, 0.02901, 0.02823, 0.02746, 0.0269, 0.02617, 0.02546, 0.02477, 0.02409, 0.0236, 0.02296, 0.02233, 0.02172, 0.02113, 0.0207, 0.02013, 0.01958, 0.01905, 0.01866, 0.01815, 0.01765, 0.01717, 0.0167, 0.01636, 0.01591, 0.01548, 0.01506, 0.01465, 0.01435, 0.01396, 0.01358, 0.01321, 0.01294, 0.01259, 0.01225, 0.01191, 0.01159, 0.01136, 0.01105, 0.01075, 0.01046, 0.01018], color:'#C9A84C'},
  CSF:       {data:[0.0, 0.00368, 0.0178, 0.0372, 0.05833, 0.07403, 0.09382, 0.11171, 0.12745, 0.14097, 0.14971, 0.1596, 0.16766, 0.17407, 0.1779, 0.18186, 0.18465, 0.18644, 0.18735, 0.18753, 0.1872, 0.18629, 0.1849, 0.1831, 0.18152, 0.17916, 0.17654, 0.17372, 0.1715, 0.16841, 0.16522, 0.16194, 0.15861, 0.15608, 0.15269, 0.14929, 0.14588, 0.14249, 0.13996, 0.13662, 0.1333, 0.13003, 0.12761, 0.12441, 0.12128, 0.11819, 0.11516, 0.11293, 0.11001, 0.10714, 0.10434, 0.1016, 0.09958, 0.09695, 0.09438, 0.09187, 0.09002, 0.08762, 0.08527, 0.08298, 0.08075, 0.07912, 0.07699, 0.07491, 0.07289, 0.07092, 0.06947, 0.06759, 0.06576, 0.06398, 0.06268, 0.06098, 0.05933, 0.05772, 0.05615, 0.05501, 0.05352, 0.05207, 0.05066, 0.04929],color:'#7C4DFF'},
  'Brain Cell':{data:[0.0, 0.00016, 0.00079, 0.0017, 0.00275, 0.00357, 0.00468, 0.00576, 0.0068, 0.00777, 0.00847, 0.00933, 0.01013, 0.01086, 0.01136, 0.01199, 0.01255, 0.01306, 0.01352, 0.01382, 0.0142, 0.01452, 0.01481, 0.01506, 0.01522, 0.0154, 0.01555, 0.01567, 0.01575, 0.01582, 0.01587, 0.01589, 0.01589, 0.01588, 0.01585, 0.0158, 0.01573, 0.01565, 0.01558, 0.01547, 0.01535, 0.01523, 0.01512, 0.01498, 0.01482, 0.01466, 0.01449, 0.01436, 0.01418, 0.014, 0.01381, 0.01362, 0.01347, 0.01327, 0.01307, 0.01287, 0.01271, 0.01251, 0.0123, 0.0121, 0.01189, 0.01173, 0.01152, 0.01132, 0.01111, 0.0109, 0.01075, 0.01055, 0.01034, 0.01014, 0.00999, 0.0098, 0.0096, 0.00941, 0.00921, 0.00907, 0.00888, 0.0087, 0.00852, 0.00834],color:'#0D6E6E'},
  Peripheral:{data:[0.0, 0.00021, 0.00047, 0.00073, 0.00097, 0.00115, 0.00139, 0.00161, 0.00183, 0.00203, 0.00219, 0.00238, 0.00257, 0.00275, 0.00289, 0.00306, 0.00322, 0.00338, 0.00354, 0.00365, 0.0038, 0.00394, 0.00407, 0.0042, 0.0043, 0.00442, 0.00454, 0.00465, 0.00473, 0.00484, 0.00494, 0.00504, 0.00514, 0.00521, 0.0053, 0.00538, 0.00547, 0.00555, 0.00561, 0.00568, 0.00575, 0.00582, 0.00588, 0.00594, 0.006, 0.00607, 0.00612, 0.00617, 0.00622, 0.00627, 0.00632, 0.00637, 0.00641, 0.00645, 0.0065, 0.00654, 0.00657, 0.00661, 0.00665, 0.00668, 0.00672, 0.00674, 0.00677, 0.00681, 0.00684, 0.00686, 0.00688, 0.00691, 0.00694, 0.00696, 0.00698, 0.007, 0.00702, 0.00704, 0.00706, 0.00707, 0.00709, 0.00711, 0.00713, 0.00714],color:'#C62828'},
};
const maxC=Math.max(...Object.values(series).flatMap(s=>s.data))*1.15||0.01;
const W2=C2.width,H2=C2.height,PAD={t:20,r:120,b:40,l:70};
const plotW=W2-PAD.l-PAD.r,plotH=H2-PAD.t-PAD.b;
const scX=i=>PAD.l+i/tArr.length*plotW;
const scY=v=>PAD.t+plotH-(v/maxC)*plotH;

const anim2=(function(){
  let t=0,playing=false,raf=null;
  function draw(progress){
    X2.fillStyle='#0a0a1a';X2.fillRect(0,0,W2,H2);
    // Grid
    X2.strokeStyle='#1F2937';X2.lineWidth=0.5;
    for(let i=0;i<=5;i++){
      const y=PAD.t+i*plotH/5;
      X2.beginPath();X2.moveTo(PAD.l,y);X2.lineTo(W2-PAD.r,y);X2.stroke();
      const v=(maxC*(1-i/5)).toFixed(5);
      X2.fillStyle='#888';X2.font='9px monospace';X2.textAlign='right';
      X2.fillText(v,PAD.l-4,y+3);
    }
    for(let i=0;i<=8;i++){
      const x=PAD.l+i*plotW/8;
      X2.beginPath();X2.moveTo(x,PAD.t);X2.lineTo(x,H2-PAD.b);X2.stroke();
      const tv=Math.round(tArr[Math.floor(i*(tArr.length-1)/8)]);
      X2.fillStyle='#888';X2.textAlign='center';
      X2.fillText(tv+'h',x,H2-PAD.b+14);
    }
    // Axes labels
    X2.fillStyle='#C9A84C';X2.font='10px monospace';X2.textAlign='center';
    X2.fillText('Time (h)',W2/2,H2-4);
    X2.save();X2.translate(14,H2/2);X2.rotate(-Math.PI/2);
    X2.fillText('Concentration (µg/mL)',0,0);X2.restore();

    // Series
    const nPts=Math.floor(progress*tArr.length);
    let li=0;
    Object.entries(series).forEach(([name,{data,color}])=>{
      if(nPts<2)return;
      X2.beginPath();
      X2.moveTo(scX(0),scY(data[0]));
      for(let i=1;i<nPts;i++) X2.lineTo(scX(i),scY(data[i]));
      X2.strokeStyle=color;X2.lineWidth=2;X2.stroke();
      // Legend
      X2.fillStyle=color;X2.fillRect(W2-PAD.r+8,PAD.t+li*18,12,3);
      X2.fillStyle='#E0E0E0';X2.font='9px monospace';X2.textAlign='left';
      X2.fillText(name,W2-PAD.r+24,PAD.t+li*18+4);
      li++;
    });
    document.getElementById('progressBar').style.width=(progress*100)+'%';
  }
  function loop(){
    if(!playing)return;
    t=Math.min(1,t+0.006);draw(t);
    if(t>=1){playing=false;document.getElementById('playBtn').textContent='↺ Replay';return;}
    raf=requestAnimationFrame(loop);
  }
  return{
    toggle(){if(t>=1)t=0;playing=!playing;
      document.getElementById('playBtn').textContent=playing?'⏸ Pause':'▶ Play';if(playing)loop();},
    reset(){t=0;playing=false;draw(0);document.getElementById('playBtn').textContent='▶ Play';},
    step(){t=Math.min(1,t+0.02);draw(t);},
  };
})();
anim2.reset();

</script>
</body>
