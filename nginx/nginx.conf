# =============================================================================
# CEREBRO-X ENTERPRISE  —  Nginx Reverse Proxy + Load Balancer
# =============================================================================
#
# Features:
#   - Round-robin load balancing across API replicas
#   - Rate limiting (per IP and per API key)
#   - Request buffering + timeouts
#   - Gzip compression
#   - Security headers (HSTS, CSP, X-Frame-Options)
#   - Health check endpoint passthrough
#   - WebSocket support (for future Celery progress streaming)
#   - SSL/TLS termination (when certs provided)
#   - Access + error logging
#
# =============================================================================

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # ── Basic settings ───────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off;    # hide nginx version

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"request":"$request",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"upstream_addr":"$upstream_addr",'
            '"http_user_agent":"$http_user_agent",'
            '"http_x_request_id":"$http_x_request_id",'
            '"http_x_api_key":"$http_x_api_key"'
        '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    # ── Gzip compression ─────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml
        application/xml;

    # ── Rate limiting zones ──────────────────────────────────────────────
    # Per-IP: 10 requests/second burst 20
    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=10r/s;

    # Per-API-key: 30 requests/second burst 50
    map $http_x_api_key $api_key_limit {
        default         $binary_remote_addr;
        "~.+"           $http_x_api_key;
    }
    limit_req_zone $api_key_limit zone=per_key:10m rate=30r/s;

    # Pipeline-specific: 2 requests/minute (heavy compute)
    limit_req_zone $binary_remote_addr zone=pipeline:10m rate=2r/m;

    limit_req_status 429;

    # ── Upstream: API servers ────────────────────────────────────────────
    upstream cerebro_api {
        least_conn;                    # least-connections load balancing
        keepalive 32;

        # Docker Compose service discovery
        # When scaled: docker-compose --scale cerebro-api=4
        # Nginx resolves all replicas via Docker DNS
        server cerebro-api:8000 max_fails=3 fail_timeout=30s;
    }

    # ── Upstream: Prometheus metrics ─────────────────────────────────────
    upstream cerebro_metrics {
        server cerebro-api:8001;
    }

    # ═════════════════════════════════════════════════════════════════════
    # HTTP Server (redirect to HTTPS in production)
    # ═════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name _;

        # ── Health checks (no auth, no rate limit) ───────────────────
        location /healthz {
            proxy_pass http://cerebro_api;
            proxy_set_header Host $host;
            access_log off;
        }

        location /readyz {
            proxy_pass http://cerebro_api;
            proxy_set_header Host $host;
            access_log off;
        }

        # ── Nginx status (internal monitoring) ───────────────────────
        location /nginx-status {
            stub_status on;
            allow 172.28.0.0/16;    # Docker network only
            deny all;
        }

        # ── API docs (less restrictive rate limit) ───────────────────
        location ~ ^/(docs|redoc|openapi.json) {
            limit_req zone=per_ip burst=5 nodelay;

            proxy_pass http://cerebro_api;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $request_id;
        }

        # ── Auth endpoints ───────────────────────────────────────────
        location /auth/ {
            limit_req zone=per_ip burst=10 nodelay;

            proxy_pass http://cerebro_api;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $request_id;

            # Tighter timeouts for auth
            proxy_connect_timeout  5s;
            proxy_read_timeout     10s;
        }

        # ── Pipeline endpoints (heavy — strict rate limit) ───────────
        location ~ ^/pipeline/ {
            limit_req zone=pipeline burst=2 nodelay;
            limit_req zone=per_key  burst=5 nodelay;

            proxy_pass http://cerebro_api;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $request_id;

            # Long timeout — pipeline can take minutes
            proxy_connect_timeout  10s;
            proxy_read_timeout     300s;
            proxy_send_timeout     300s;

            # Large uploads (Excel files)
            client_max_body_size 50M;
        }

        # ── DDS endpoints ────────────────────────────────────────────
        location /dds/ {
            limit_req zone=per_key burst=20 nodelay;

            proxy_pass http://cerebro_api;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $request_id;

            proxy_read_timeout 120s;
        }

        # ── ML inference endpoints ───────────────────────────────────
        location /predict {
            limit_req zone=per_key burst=30 nodelay;

            proxy_pass http://cerebro_api;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $request_id;

            proxy_read_timeout 30s;
        }

        # ── Prometheus metrics (internal only) ───────────────────────
        location /metrics {
            proxy_pass http://cerebro_metrics;
            allow 172.28.0.0/16;
            deny all;
        }

        # ── Default: all other API routes ────────────────────────────
        location / {
            limit_req zone=per_ip  burst=20 nodelay;
            limit_req zone=per_key burst=50 nodelay;

            proxy_pass http://cerebro_api;

            # Headers
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $request_id;
            proxy_set_header Connection        "";

            # Timeouts
            proxy_connect_timeout  10s;
            proxy_read_timeout     60s;
            proxy_send_timeout     60s;

            # Buffering
            proxy_buffering        on;
            proxy_buffer_size      4k;
            proxy_buffers          8 16k;

            # Body size
            client_max_body_size   20M;

            # Security headers
            add_header X-Frame-Options         "DENY" always;
            add_header X-Content-Type-Options  "nosniff" always;
            add_header X-XSS-Protection        "1; mode=block" always;
            add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'" always;
        }

        # ── Custom error pages ───────────────────────────────────────
        error_page 429 /429.json;
        location = /429.json {
            default_type application/json;
            return 429 '{"error":"rate_limit_exceeded","message":"Too many requests. Slow down.","retry_after_seconds":60}';
        }

        error_page 502 /502.json;
        location = /502.json {
            default_type application/json;
            return 502 '{"error":"bad_gateway","message":"API server unavailable. Retrying..."}';
        }

        error_page 503 /503.json;
        location = /503.json {
            default_type application/json;
            return 503 '{"error":"service_unavailable","message":"System under maintenance."}';
        }
    }

    # ═════════════════════════════════════════════════════════════════════
    # HTTPS Server (uncomment when SSL certs are available)
    # ═════════════════════════════════════════════════════════════════════
    # server {
    #     listen 443 ssl http2;
    #     server_name cerebro.example.com;
    #
    #     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #
    #     # HSTS
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     # Same location blocks as above...
    # }
}
