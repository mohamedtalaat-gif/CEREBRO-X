# =============================================================================
# CEREBRO-X v22.1  —  CI/CD Pipeline (GitHub Actions)
# =============================================================================
#
# Triggers:
#   - Push to main/develop → full pipeline
#   - Pull request → lint + test only
#   - Manual dispatch → full pipeline with env selection
#
# Stages:
#   1. Lint (ruff, mypy)
#   2. Unit tests (pytest)
#   3. Integration tests (docker-compose test stack)
#   4. Build Docker images
#   5. Push to container registry
#   6. Deploy to staging/production
#
# =============================================================================

name: CEREBRO-X CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/cerebro-x

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ═══════════════════════════════════════════════════════════════════════════
  # Stage 1: Code Quality
  # ═══════════════════════════════════════════════════════════════════════════
  lint:
    name: "Lint & Type Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install linters
        run: pip install ruff mypy types-requests types-PyYAML

      - name: Ruff lint
        run: ruff check . --output-format=github
        continue-on-error: true  # ~1,100 pre-existing findings (bare excepts, naive
                                  # datetimes, unused locals) predate this pipeline being
                                  # wired up; report them without blocking Unit Tests/Build/
                                  # Deploy until they're paid down incrementally. Same policy
                                  # as the mypy step below.

      - name: Ruff format check
        run: ruff format --check .
        continue-on-error: true  # 93 files predate `ruff format` adoption; same rationale.

      - name: Mypy type check (non-strict)
        run: mypy --ignore-missing-imports --no-strict-optional src/api/app.py src/api/auth.py src/ml/mlops.py
        continue-on-error: true  # gradual adoption

  # ═══════════════════════════════════════════════════════════════════════════
  # Stage 2: Unit Tests
  # ═══════════════════════════════════════════════════════════════════════════
  test:
    name: "Unit Tests"
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Run unit tests
        run: |
          pytest tests/ \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing \
            -v --tb=short
        env:
          DATABASE_URL: "sqlite:///test_cerebro.db"
          JWT_SECRET_KEY: "test_secret_key_for_ci_only"
          REDIS_URL: "redis://localhost:6379/0"

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          flags: unittests

  # ═══════════════════════════════════════════════════════════════════════════
  # Stage 3: Integration Tests (full docker-compose stack)
  # ═══════════════════════════════════════════════════════════════════════════
  integration:
    name: "Integration Tests"
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: cerebro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-timeout httpx

      - name: Run integration tests
        run: |
          pytest tests/integration/ \
            -v --tb=short \
            --timeout=120
        env:
          DATABASE_URL: "postgresql://postgres:test_password@localhost:5432/cerebro_test"
          REDIS_URL: "redis://localhost:6379/0"
          JWT_SECRET_KEY: "integration_test_secret_key"
          CELERY_BROKER: "redis://localhost:6379/0"
          CELERY_BACKEND: "redis://localhost:6379/1"

  # ═══════════════════════════════════════════════════════════════════════════
  # Stage 4: Build Docker Images
  # ═══════════════════════════════════════════════════════════════════════════
  build:
    name: "Build & Push Docker Images"
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push'
    # GITHUB_TOKEN can't create a brand-new GHCR package on a personal
    # (non-org) account's first-ever push to a given image name, even
    # with packages: write declared here — GHCR ties that first creation
    # to account-level settings that require a real PAT once, not the
    # ephemeral workflow token. Not fatal: docker compose builds every
    # image locally from the Dockerfiles in this repo regardless of
    # whether a prebuilt image ever reaches the registry, so a failure
    # here shouldn't red-X the whole pipeline over a convenience step.
    continue-on-error: true

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile
            image_suffix: api
          - dockerfile: Dockerfile.worker
            image_suffix: worker

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image_suffix }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══════════════════════════════════════════════════════════════════════════
  # Stage 5: Deploy
  # ═══════════════════════════════════════════════════════════════════════════
  # NOT WIRED UP YET: no staging/production server exists to deploy to.
  # These two jobs used to `echo "... deployment complete"` /
  # `echo "All checks passed"` with every real command commented out --
  # meaning a run always showed a green checkmark for "Production
  # deployment complete" and "All checks passed" whether or not anything
  # actually happened, because nothing did.
  deploy-staging:
    # Disabled (skipped, not run) rather than left to auto-run on every
    # push to main showing a fake "complete" -- `if: false` gives a clean
    # "skipped" status instead of either a misleading pass or a failure
    # spamming every routine push. Flip back to
    # `if: github.ref == 'refs/heads/main'` once the real deploy steps
    # below are filled in.
    name: "Deploy to Staging (not yet implemented)"
    runs-on: ubuntu-latest
    needs: [build, integration]
    if: false
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging server
        run: |
          # SSH into staging server and pull + restart
