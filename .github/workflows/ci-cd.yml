          exit 1

      - name: Smoke test
        run: |
          # curl -f https://staging.cerebro-x.com/healthz
          # curl -f https://staging.cerebro-x.com/readyz
          echo "::error::Not implemented -- fill in real smoke-test curls above."
          exit 1

  deploy-production:
    # Manual-trigger-only (workflow_dispatch, environment=production) --
    # unlike deploy-staging this never runs on a routine push, so failing
    # loudly here doesn't spam anyone; it only fires if a human explicitly
    # asks for a production deploy, and they need to know it didn't
    # actually happen rather than see a false "All checks passed".
    # `needs: [deploy-staging]` was dropped for now: with deploy-staging
    # disabled (if: false, see above) a "needs" dependency on it would
    # make this job perpetually skipped too, silently defeating the point
    # of making a deliberate manual dispatch fail loudly. Restore the
    # dependency once deploy-staging is for-real implemented and
    # re-enabled.
    name: "Deploy to Production (not yet implemented)"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment: production

    steps:
